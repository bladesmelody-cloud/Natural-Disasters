name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - uses: gradle/actions/setup-gradle@v4

      - name: Build
        run: ./gradlew build

      - name: Game tests
        run: ./gradlew runGameTestServer

      - name: Upload jar
        uses: actions/upload-artifact@v4
        with:
          name: naturaldisasters-${{ github.sha }}
          path: build/libs/*.jar
